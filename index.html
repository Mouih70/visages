<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Visages</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2430">
<!-- Sécurité : seuls ce site, le CDN des modèles et Google (connexion + Gmail en lecture) sont autorisés -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com 'wasm-unsafe-eval'; connect-src 'self' https://cdn.jsdelivr.net https://gmail.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self' blob:">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--fond:#f4f5f7;--texte:#1f2430;--carte:#fff;--nav:#1f2430}
*{box-sizing:border-box}body{font-family:Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--fond);color:var(--texte)}
nav{background:var(--nav);padding:10px 14px;display:flex;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:2}
nav a{color:#fff;text-decoration:none;font-weight:600}nav a.actif{border-bottom:2px solid #4fc3f7}
main{padding:14px;max-width:1100px;margin:auto}h1{font-size:19px;margin:6px 0 12px}
#statut{background:#e3f2fd;color:#0d47a1;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}#statut:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button,.bouton{padding:9px 14px;border:0;border-radius:8px;background:#1565c0;color:#fff;font-size:15px;cursor:pointer}
button.sup{background:#9e9e9e}button.danger{background:#c62828}
.kpi{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.kpi div{background:var(--carte);border-radius:10px;padding:10px 14px;box-shadow:0 1px 3px #0001}
.kpi b{font-size:22px;display:block}.rouge{color:#c62828}
.tableau{overflow-x:auto;border-radius:10px}table{width:100%;border-collapse:collapse;background:var(--carte)}
td,th{padding:7px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle;font-size:14px}
tr.inconnu{background:#fdecea}tr.visiteur{background:#fff3e0}img.v{width:52px;height:52px;object-fit:cover;border-radius:8px}
.badge{color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap;background:#c62828}
.badge.resident{background:#2e7d32}.badge.visiteur{background:#ef6c00}.badge.personnel{background:#1565c0}.badge.livreur{background:#6a1b9a}.badge.autre{background:#546e7a}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.carte{background:var(--carte);border-radius:10px;padding:12px;box-shadow:0 1px 3px #0001}
.carte img.g{width:100%;height:200px;object-fit:cover;border-radius:8px}.petit{font-size:12px;color:#667}
input,select{padding:9px;border:1px solid #ccd;border-radius:8px;width:100%;margin-top:7px;font-size:15px;background:#fff}
label{display:block;margin-top:12px;font-size:13px;font-weight:600}
</style></head>
<body>
<nav><a href="#passages">Passages</a><a href="#identifier">À identifier</a><a href="#personnes">Personnes</a><a href="#reglages">Réglages</a></nav>
<main><div id="statut"></div><div id="page">Chargement…</div></main>
<input type="file" id="photos" accept="image/*" multiple hidden>
<script type="module" src="app.js"></script>
</body></html>
